<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dewdrop | Cottagecore Weather</title>
  <meta name="description" content="A whimsical cottagecore weather app providing forecasts and cozy outfit suggestions.">
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&family=Lato:wght@400;700&family=Playfair+Display:ital,wght@0,500;0,700;1,500&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-base: #f5efe6;
      --bg-card: #fffaf5;
      --brown-primary: #8b5e3c;
      --brown-light: #d4b896;
      --text-dark: #4a3728;
      --text-muted: #a08060;
      --radius-pill: 50px;
      --radius-card: 24px;
      --radius-screen: 32px;
      --hero-bg: #e6f0fa;
      --hero-text: #2c3e50;
      
      /* Theme backgrounds */
      --theme-sunny-bg: linear-gradient(135deg, #fdf6e3, #f5e3bc);
      --theme-sunny-text: #8b5e3c;
      --theme-cloudy-bg: linear-gradient(135deg, #e0e5ec, #c8d1db);
      --theme-cloudy-text: #4a5568;
      --theme-rainy-bg: linear-gradient(135deg, #d4e0eb, #aebad2);
      --theme-rainy-text: #2c3e50;
      --theme-snowy-bg: linear-gradient(135deg, #f0f4f8, #e2e8f0);
      --theme-snowy-text: #2d3748;
      --theme-stormy-bg: linear-gradient(135deg, #cbd5e1, #94a3b8);
      --theme-stormy-text: #1e293b;
    }

    .theme-sunny { --hero-bg: var(--theme-sunny-bg); --hero-text: var(--theme-sunny-text); }
    .theme-cloudy { --hero-bg: var(--theme-cloudy-bg); --hero-text: var(--theme-cloudy-text); }
    .theme-rainy { --hero-bg: var(--theme-rainy-bg); --hero-text: var(--theme-rainy-text); }
    .theme-snowy { --hero-bg: var(--theme-snowy-bg); --hero-text: var(--theme-snowy-text); }
    .theme-stormy { --hero-bg: var(--theme-stormy-bg); --hero-text: var(--theme-stormy-text); }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Lato', sans-serif;
      background-color: #e0d8c8;
      color: var(--text-dark);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    h1, h2, h3, .temp-display, .font-playfair {
      font-family: 'Playfair Display', serif;
    }

    .font-accent {
      font-family: 'Caveat', cursive;
    }

    .app-container {
      width: 100%;
      max-width: 390px;
      min-height: 100vh;
      background-color: var(--bg-base);
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      box-shadow: 0 20px 50px rgba(139, 94, 60, 0.15);
    }

    @media (min-width: 400px) {
      .app-container {
        min-height: 844px;
        border-radius: var(--radius-screen);
        margin: 20px 0;
      }
    }

    .screen {
      display: none;
      flex-direction: column;
      flex: 1;
      padding: 24px;
      opacity: 0;
      transition: opacity 0.4s ease;
    }

    .screen.active {
      display: flex;
      opacity: 1;
    }

    /* Search Screen */
    #search-screen {
      justify-content: center;
      align-items: center;
      text-align: center;
      background-image: radial-gradient(circle at top right, rgba(253,246,227,0.8), transparent), 
                        radial-gradient(circle at bottom left, rgba(212,184,150,0.2), transparent);
    }

    .logo-container {
      margin-bottom: 40px;
    }

    .logo-icon {
      font-size: 3rem;
      margin-bottom: 10px;
    }

    .logo-text {
      font-size: 2.5rem;
      color: var(--brown-primary);
      margin-bottom: 8px;
    }

    .logo-subtext {
      font-size: 1.1rem;
      color: var(--text-muted);
      font-style: italic;
    }

    .search-form {
      width: 100%;
      position: relative;
    }

    .search-input {
      width: 100%;
      padding: 16px 24px;
      font-size: 1.1rem;
      font-family: 'Lato', sans-serif;
      border: 2px solid var(--brown-light);
      border-radius: var(--radius-pill);
      background: var(--bg-card);
      color: var(--text-dark);
      outline: none;
      transition: all 0.3s ease;
      box-shadow: 0 4px 15px rgba(0,0,0,0.03);
    }

    .search-input:focus {
      border-color: var(--brown-primary);
      box-shadow: 0 6px 20px rgba(139, 94, 60, 0.15);
    }

    .search-btn {
      position: absolute;
      right: 8px;
      top: 50%;
      transform: translateY(-50%);
      background: var(--brown-primary);
      color: white;
      border: none;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      cursor: pointer;
      font-size: 1.2rem;
      display: flex;
      justify-content: center;
      align-items: center;
      transition: background 0.3s ease;
    }

    .search-btn:hover {
      background: #734c30;
    }

    /* Confirm Screen */
    #confirm-screen h2 {
      text-align: center;
      color: var(--brown-primary);
      margin-bottom: 24px;
      font-size: 1.8rem;
    }

    .results-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
      flex: 1;
      overflow-y: auto;
    }

    .result-card {
      background: var(--bg-card);
      border: 1px solid var(--brown-light);
      border-radius: var(--radius-card);
      padding: 16px 20px;
      cursor: pointer;
      transition: all 0.3s ease;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .result-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(139, 94, 60, 0.1);
      border-color: var(--brown-primary);
    }

    .result-city {
      font-size: 1.2rem;
      font-weight: 700;
      color: var(--brown-primary);
    }

    .result-region {
      font-size: 0.9rem;
      color: var(--text-muted);
    }

    .back-btn {
      margin-top: 24px;
      padding: 14px;
      background: transparent;
      border: 1px solid var(--brown-primary);
      color: var(--brown-primary);
      border-radius: var(--radius-pill);
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      font-family: 'Lato', sans-serif;
      transition: all 0.3s ease;
    }

    .back-btn:hover {
      background: rgba(139, 94, 60, 0.05);
    }

    .error-msg {
      color: #b94a48;
      text-align: center;
      margin: 16px 0;
      font-style: italic;
    }

    /* Forecast Screen */
    #forecast-screen {
      padding: 0;
      background: var(--bg-base);
    }

    .forecast-hero {
      background: var(--hero-bg, #e6f0fa);
      color: var(--hero-text, #2c3e50);
      padding: 40px 24px;
      border-bottom-left-radius: 40px;
      border-bottom-right-radius: 40px;
      text-align: center;
      transition: background 0.8s ease, color 0.8s ease;
      position: relative;
    }

    .top-actions {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .icon-btn {
      background: rgba(255,255,255,0.3);
      border: none;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      cursor: pointer;
      font-size: 1.2rem;
      color: inherit;
      backdrop-filter: blur(5px);
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .city-name {
      font-size: 1.8rem;
      font-weight: 700;
    }

    .current-weather-box {
      margin: 20px 0;
    }

    .weather-emoji {
      font-size: 4rem;
      margin-bottom: 10px;
      filter: drop-shadow(0 4px 8px rgba(0,0,0,0.1));
    }

    .temp-display {
      font-size: 4.5rem;
      line-height: 1;
      font-weight: 500;
      margin-bottom: 8px;
    }

    .weather-desc {
      font-size: 1.2rem;
      font-style: italic;
      opacity: 0.9;
    }

    .stats-row {
      display: flex;
      justify-content: center;
      gap: 24px;
      margin-top: 24px;
      padding: 16px;
      background: rgba(255,255,255,0.4);
      border-radius: var(--radius-card);
      backdrop-filter: blur(10px);
    }

    .stat {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
    }

    .stat-label {
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      opacity: 0.8;
    }

    .stat-val {
      font-size: 1.1rem;
      font-weight: 700;
    }

    .forecast-content {
      padding: 24px;
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    .outfit-card {
      background: var(--bg-card);
      border-radius: var(--radius-card);
      padding: 20px;
      box-shadow: 0 8px 24px rgba(139, 94, 60, 0.08);
      position: relative;
    }

    .outfit-header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 12px;
    }

    .outfit-emoji {
      font-size: 2rem;
    }

    .outfit-title {
      font-size: 1.5rem;
      color: var(--brown-primary);
    }

    .outfit-text {
      font-size: 1rem;
      line-height: 1.5;
      margin-bottom: 16px;
      color: var(--text-dark);
    }

    .outfit-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .tag {
      background: var(--bg-base);
      color: var(--brown-primary);
      padding: 6px 12px;
      border-radius: var(--radius-pill);
      font-size: 0.85rem;
      border: 1px solid var(--brown-light);
    }

    .daily-forecast {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .daily-pill {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px;
      background: var(--bg-card);
      border-radius: var(--radius-pill);
      box-shadow: 0 4px 12px rgba(139, 94, 60, 0.05);
    }

    .day-name {
      font-weight: 700;
      width: 50px;
      color: var(--text-dark);
    }

    .day-icon {
      font-size: 1.4rem;
    }

    .day-temps {
      display: flex;
      gap: 12px;
      font-family: 'Playfair Display', serif;
      font-size: 1.1rem;
      color: var(--brown-primary);
    }

    .temp-min {
      color: var(--text-muted);
    }

    .footer {
      text-align: center;
      padding: 16px;
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    .footer a {
      color: var(--brown-primary);
      text-decoration: none;
    }

    /* Loading Overlay */
    .loader-overlay {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(245, 239, 230, 0.9);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 100;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }
    .loader-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .spinner {
      width: 40px;
      height: 40px;
      border: 4px solid var(--brown-light);
      border-top-color: var(--brown-primary);
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin { 
      100% { transform: rotate(360deg); } 
    }

  </style>
</head>
<body>

  <div class="app-container">
    
    <!-- Loader Overlay -->
    <div class="loader-overlay" id="loader">
      <div class="spinner"></div>
    </div>

    <!-- Screen 1: Search -->
    <div id="search-screen" class="screen active">
      <div class="logo-container">
        <div class="logo-icon">🌿</div>
        <h1 class="logo-text">Dewdrop</h1>
        <div class="logo-subtext font-accent">cottagecore weather</div>
      </div>
      
      <form class="search-form" id="search-form">
        <input type="text" class="search-input" id="search-input" placeholder="Find a cozy spot..." autocomplete="off" required>
        <button type="submit" class="search-btn">🔍</button>
      </form>
    </div>

    <!-- Screen 2: Confirm Location -->
    <div id="confirm-screen" class="screen">
      <h2>Select Location</h2>
      <div class="error-msg" id="confirm-error" style="display: none;"></div>
      <div class="results-list" id="results-list">
        <!-- Results populated via JS -->
      </div>
      <button class="back-btn" onclick="showScreen('search-screen')">Go Back</button>
    </div>

    <!-- Screen 3: Forecast -->
    <div id="forecast-screen" class="screen">
      <div class="forecast-hero" id="hero-section">
        <div class="top-actions">
          <button class="icon-btn" onclick="showScreen('search-screen')" aria-label="Search another place">
            <span>🔍</span>
          </button>
          <h2 class="city-name" id="display-city">City</h2>
          <div style="width: 40px;"></div> <!-- spacer -->
        </div>
        
        <div class="current-weather-box">
          <div class="weather-emoji" id="current-emoji">☀️</div>
          <div class="temp-display"><span id="current-temp">--</span>°</div>
          <div class="weather-desc font-accent" id="current-desc">Sunny & Bright</div>
        </div>

        <div class="stats-row">
          <div class="stat">
            <span class="stat-label">Feels Like</span>
            <span class="stat-val"><span id="stat-feels">--</span>°</span>
          </div>
          <div class="stat">
            <span class="stat-label">Wind</span>
            <span class="stat-val"><span id="stat-wind">--</span> km/h</span>
          </div>
          <div class="stat">
            <span class="stat-label">Humidity</span>
            <span class="stat-val"><span id="stat-humidity">--</span>%</span>
          </div>
        </div>
      </div>

      <div class="forecast-content">
        <!-- Error message if forecast fails -->
        <div class="error-msg" id="forecast-error" style="display: none;">
          <p>Oh no, the weather fairies are busy. Try again?</p>
          <button class="back-btn" onclick="retryForecast()" style="margin-top: 8px; padding: 8px 16px;">Retry</button>
        </div>

        <!-- Outfit Suggestion -->
        <div class="outfit-card" id="outfit-section">
          <div class="outfit-header">
            <div class="outfit-emoji" id="outfit-emoji">👗</div>
            <h3 class="outfit-title font-accent" id="outfit-title">Outfit</h3>
          </div>
          <p class="outfit-text" id="outfit-text">Loading...</p>
          <div class="outfit-tags" id="outfit-tags">
            <!-- Tags populated via JS -->
          </div>
        </div>

        <!-- 7-Day Forecast -->
        <h3 style="color: var(--brown-primary); font-size: 1.2rem; margin-top: 8px;">Next 7 Days</h3>
        <div class="daily-forecast" id="daily-list">
          <!-- Daily pills populated via JS -->
        </div>

        <div class="footer">
          Weather data by <a href="https://open-meteo.com/" target="_blank">Open-Meteo</a> 🌿
        </div>
      </div>
    </div>

  </div>

  <script>
    // --- State ---
    let currentLat = null;
    let currentLon = null;
    let currentCityName = "";

    // --- DOM Elements ---
    const screens = {
      'search-screen': document.getElementById('search-screen'),
      'confirm-screen': document.getElementById('confirm-screen'),
      'forecast-screen': document.getElementById('forecast-screen')
    };
    const loader = document.getElementById('loader');
    const confirmError = document.getElementById('confirm-error');
    const forecastError = document.getElementById('forecast-error');
    const heroSection = document.getElementById('hero-section');
    const outfitSection = document.getElementById('outfit-section');

    // --- Routing ---
    function showScreen(id) {
      Object.values(screens).forEach(screen => screen.classList.remove('active'));
      if (screens[id]) {
        screens[id].classList.add('active');
        if(id === 'search-screen') {
          document.getElementById('search-input').value = '';
          document.getElementById('search-input').focus();
        }
      }
    }

    function showLoader(show) {
      if(show) loader.classList.add('active');
      else loader.classList.remove('active');
    }

    // --- Weather Utilities ---
    function getWeatherTheme(code) {
      if (code === 0 || code === 1) return 'theme-sunny';
      if (code <= 3)  return 'theme-cloudy';
      if (code <= 67) return 'theme-rainy';
      if (code <= 77) return 'theme-snowy';
      return 'theme-stormy';
    }

    function getWeatherDetails(code) {
      if (code === 0) return { emoji: "☀️", desc: "Clear Sky" };
      if (code === 1) return { emoji: "🌤️", desc: "Mainly Clear" };
      if (code === 2) return { emoji: "⛅", desc: "Partly Cloudy" };
      if (code === 3) return { emoji: "☁️", desc: "Overcast" };
      if (code <= 49) return { emoji: "🌫️", desc: "Foggy" };
      if (code <= 67) return { emoji: "🌧️", desc: "Rainy" };
      if (code <= 77) return { emoji: "❄️", desc: "Snowy" };
      if (code <= 82) return { emoji: "🌦️", desc: "Rain Showers" };
      if (code <= 86) return { emoji: "🌨️", desc: "Snow Showers" };
      return { emoji: "🌩️", desc: "Thunderstorm" };
    }

    function getOutfit(temp, weatherCode) {
      const isRainy = weatherCode >= 51 && weatherCode <= 82;
      
      if (weatherCode >= 95) return { emoji: "🌩️", title: "Thunderstorm Layers", text: "Cozy thick knit cardigan, warm leggings, and sturdy indoor slippers.", tags: ["Cardigan", "Leggings", "Slippers"] };
      if (weatherCode >= 71 && weatherCode <= 75) return { emoji: "❄️", title: "Snow Day Woolens", text: "Heavy wool coat, thermal layers, knitted scarf and warm boots.", tags: ["Wool Coat", "Scarf", "Boots"] };
      if (temp < 5) return { emoji: "🧥", title: "Frosty Morning Wrap", text: "Padded winter coat, thick sweater, gloves, and a beanie.", tags: ["Winter Coat", "Sweater", "Beanie"] };
      if (temp < 12 && isRainy) return { emoji: "🌂", title: "Rainy Day Trench", text: "Classic trench coat, waterproof boots, and an umbrella.", tags: ["Trench Coat", "Rain Boots", "Umbrella"] };
      if (temp < 12) return { emoji: "🧣", title: "Chilly Autumn Knits", text: "Chunky knit sweater, corduroy pants, and ankle boots.", tags: ["Sweater", "Corduroys", "Boots"] };
      if (temp < 18 && isRainy) return { emoji: "🌧️", title: "Drizzly Afternoon", text: "Light rain jacket, long sleeve shirt, and water-resistant shoes.", tags: ["Rain Jacket", "Long Sleeve", "Shoes"] };
      if (temp < 18) return { emoji: "🍂", title: "Brisk Walk Cardigan", text: "Light cardigan, jeans, and comfortable walking shoes.", tags: ["Cardigan", "Jeans", "Walking Shoes"] };
      if (temp < 25 && isRainy) return { emoji: "🌦️", title: "Warm Showers", text: "Breathable light jacket, t-shirt, and quick-dry trousers.", tags: ["Light Jacket", "T-shirt", "Trousers"] };
      if (temp < 25) return { emoji: "🌷", title: "Springtime Picnic", text: "Flowy midi skirt, light blouse, and a sun hat.", tags: ["Midi Skirt", "Blouse", "Sun Hat"] };
      
      return { emoji: "🌸", title: "The Golden Hour Garden Dress", text: "Flowy linen dress, flat sandals, and a basket bag.", tags: ["Linen dress", "Flat sandals", "Basket bag"] };
    }

    function formatDayOfWeek(dateString) {
      const date = new Date(dateString);
      // add timezone offset workaround for local days
      const days = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
      return days[date.getUTCDay()];
    }

    // --- APIs ---
    
    // 1. Search Form Submit
    document.getElementById('search-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const query = document.getElementById('search-input').value.trim();
      if (!query) return;

      showLoader(true);
      confirmError.style.display = 'none';
      const resultsList = document.getElementById('results-list');
      resultsList.innerHTML = '';

      try {
        const res = await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(query)}&count=5&language=en&format=json`);
        if (!res.ok) throw new Error("Network issue");
        const data = await res.json();
        
        if (!data.results || data.results.length === 0) {
          confirmError.textContent = "We couldn't find that little spot. Check the spelling? 🍄";
          confirmError.style.display = 'block';
        } else {
          data.results.forEach(city => {
            const card = document.createElement('div');
            card.className = 'result-card';
            const regionInfo = [city.admin1, city.country].filter(Boolean).join(', ');
            
            card.innerHTML = `
              <div class="result-city">${city.name}</div>
              <div class="result-region">${regionInfo}</div>
            `;
            
            card.onclick = () => selectCity(city.name, city.latitude, city.longitude);
            resultsList.appendChild(card);
          });
        }
        
        showScreen('confirm-screen');
      } catch (err) {
        confirmError.textContent = "The connection to the weather sprites got lost. Try again later! 🧚‍♀️";
        confirmError.style.display = 'block';
        showScreen('confirm-screen');
      } finally {
        showLoader(false);
      }
    });

    // 2. City Selection -> Fetch Forecast
    async function selectCity(name, lat, lon) {
      currentCityName = name;
      currentLat = lat;
      currentLon = lon;
      fetchForecast();
    }

    async function retryForecast() {
      if(currentLat !== null) {
        fetchForecast();
      }
    }

    async function fetchForecast() {
      showLoader(true);
      forecastError.style.display = 'none';
      outfitSection.style.display = 'none';
      document.getElementById('daily-list').style.display = 'none';
      
      try {
        const res = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${currentLat}&longitude=${currentLon}&current=temperature_2m,apparent_temperature,weather_code,wind_speed_10m,relative_humidity_2m&daily=weather_code,temperature_2m_max,temperature_2m_min&forecast_days=7&timezone=auto`);
        if (!res.ok) throw new Error("Forecast fetch failed");
        
        const data = await res.json();
        renderForecast(data);
        showScreen('forecast-screen');
      } catch (err) {
        forecastError.style.display = 'block';
        showScreen('forecast-screen');
      } finally {
        showLoader(false);
      }
    }

    // 3. Render Forecast Data
    function renderForecast(data) {
      const cur = data.current;
      const daily = data.daily;
      
      // Update Hero Text
      document.getElementById('display-city').textContent = currentCityName;
      document.getElementById('current-temp').textContent = Math.round(cur.temperature_2m);
      
      const weatherDetails = getWeatherDetails(cur.weather_code);
      document.getElementById('current-emoji').textContent = weatherDetails.emoji;
      document.getElementById('current-desc').textContent = weatherDetails.desc;
      
      // Update Stats
      document.getElementById('stat-feels').textContent = Math.round(cur.apparent_temperature);
      document.getElementById('stat-wind').textContent = Math.round(cur.wind_speed_10m);
      document.getElementById('stat-humidity').textContent = Math.round(cur.relative_humidity_2m);

      // Apply Theme
      const themeClass = getWeatherTheme(cur.weather_code);
      heroSection.className = `forecast-hero ${themeClass}`;

      // Update Outfit
      const outfit = getOutfit(cur.temperature_2m, cur.weather_code);
      document.getElementById('outfit-emoji').textContent = outfit.emoji;
      document.getElementById('outfit-title').textContent = outfit.title;
      document.getElementById('outfit-text').textContent = outfit.text;
      
      const tagsContainer = document.getElementById('outfit-tags');
      tagsContainer.innerHTML = '';
      outfit.tags.forEach(tag => {
        const span = document.createElement('span');
        span.className = 'tag';
        span.textContent = tag;
        tagsContainer.appendChild(span);
      });
      outfitSection.style.display = 'block';

      // Update Daily
      const dailyList = document.getElementById('daily-list');
      dailyList.innerHTML = '';
      
      for(let i = 1; i < daily.time.length; i++) { // Skip today (index 0) if desired, but let's show all 7
        const dayDiv = document.createElement('div');
        dayDiv.className = 'daily-pill';
        
        const dDetails = getWeatherDetails(daily.weather_code[i]);
        const dayName = i === 0 ? 'Today' : formatDayOfWeek(daily.time[i]);
        const maxT = Math.round(daily.temperature_2m_max[i]);
        const minT = Math.round(daily.temperature_2m_min[i]);

        dayDiv.innerHTML = `
          <div class="day-name">${dayName}</div>
          <div class="day-icon">${dDetails.emoji}</div>
          <div class="day-temps">
            <span class="temp-max">${maxT}°</span>
            <span class="temp-min">${minT}°</span>
          </div>
        `;
        dailyList.appendChild(dayDiv);
      }
      dailyList.style.display = 'flex';
    }

  </script>
</body>
</html>
